name: Zenysis
description: >-
  Zenysis is a health intelligence infrastructure company that helps governments
  and organizations across low- and middle-income countries turn fragmented,
  messy health data into actionable insight. Its flagship Harmony Analytics
  Platform is open source (AGPL-3.0) and transforms, cleans, enriches, and
  integrates data from many disparate sources for analysis, visualization, and
  decision support. Zenysis powers national health information systems, disease
  surveillance, and program monitoring. There is no public hosted API product;
  Harmony is self-hosted and exposes its own REST (Flask-Potion) and GraphQL
  interfaces on a per-deployment basis. This repo was surfaced as a portfolio
  company of 500 Global and enriched from the company's public web and GitHub
  presence.
